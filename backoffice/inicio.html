<!DOCTYPE html>

</head>
<body>

  <aside class="sidebar">

      <a href="#" class="nav-item" id="menu-dashboard"><i class="fas fa-home"></i> Dashboard</a>

      </a>

  </aside>

  <main class="main-content" id="main-content">
    <h1>Bienvenido al Panel de Administración</h1>
  </main>

  <script>
  
// ======================================================
// 🔐 PROTECCIÓN DE SESIÓN (SI NO HAY LOGIN → REDIRECT)
// ======================================================
window.__ME__ = null;

(async () => {
  try {
    const res = await fetch('/api/me.php', {
      credentials: 'include'
    });

    const data = await res.json().catch(() => ({}));

    // si no está autenticado → volver al login
    if (!res.ok || !data.ok) {
      window.location.href = './index.html';
      return;
    }

    // ✅ guardamos el admin (id, username, role, scope_kit)
    window.__ME__ = data.admin || null;

    // ======================================================
    // ✅ PUNTO 1: ocultar tab "Administrar usuarios"
    // (solo debe verse para admin_total)
    // ======================================================
    const role = window.__ME__?.role ?? null;

    const menuAdmins = document.getElementById('menu-admins'); // <- tu <a id="menu-admins">
    if (menuAdmins && role !== 'admin_total') {
      menuAdmins.style.display = 'none';
    }

    const menuMaratones = document.getElementById('menu-maratones');
    if (menuMaratones && role === 'admin_externo') {
      menuMaratones.style.display = 'none';
    }

    const menuScanQr = document.getElementById('menu-scan-qr');

// Solo admin_total y admin_visualizador pueden escanear
if (menuScanQr && !['admin_total', 'admin_visualizador'].includes(role)) {
  menuScanQr.style.display = 'none';
}

  } catch (e) {
    window.location.href = './index.html';
  }
})();


  // ======================================================
  // LOGOUT
  // ======================================================
  document.getElementById('btn-logout')?.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await fetch('/api/logout.php', {
        method: 'POST',
        credentials: 'include'
      });
    } finally {
      window.location.href = './index.html';
    }
  });

  // ======================================================
  // LISTADO INSCRIPCIONES + CSV
  // ======================================================

  const LISTAR_URL = '/api/listar_inscripciones.php';
  let filtroActual = { q: '', sort: 'fecha_inscripcion', order: 'desc', kit: '', page: 1, pageSize: 20 };

  async function cargarInscripciones({ q = '', page = 1, pageSize = 20 } = {}) {
    const main = document.getElementById('main-content');
    const offset = (page - 1) * pageSize;
    filtroActual.q = q;

    main.innerHTML = `<h2>Usuarios Registrados</h2><p>Cargando...</p>`;

    try {
      const url = `${LISTAR_URL}?limit=${pageSize}&offset=${offset}&q=${encodeURIComponent(q)}&kit=${encodeURIComponent(filtroActual.kit || '')}&sort=${filtroActual.sort}&order=${filtroActual.order}`;
      const res = await fetch(url, { credentials: 'include' });
      const ct = res.headers.get('content-type') || '';
      const data = ct.includes('application/json') ? await res.json()
                                                   : { success:false, message: await res.text() };

      if (!res.ok || !data.success) throw new Error(data.message || 'No se pudo obtener inscripciones');
      
      // Guardar estado
    filtroActual.page = page;
    filtroActual.pageSize = pageSize;

    // Calcular páginas
    const total = Number(data.total || 0);
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const currentPage = Math.min(Math.max(1, page), totalPages);
    const hasPrev = currentPage > 1;
    const hasNext = currentPage < totalPages;


      // ✅ ACÁ (PUNTO 1): permisos según rol
      const role = window.__ME__?.role;
      const canWrite = role === 'admin_total';
      
      const filas = (data.items || []).map(u => `
        <tr>
          <td>${esc(u.nombre)}</td>
          <td>${esc(u.dni)}</td>
          <td>${esc(u.email)}</td>
          <td>${esc(u.carrera)}</td>
          <td>${formatearFecha(u.fecha_inscripcion)}</td>
          <td>
            <button class="btn-mini" data-action="ver" data-id="${u.id}">Ver</button>
            ${canWrite ? `
            <button class="btn-mini" data-action="editar" data-id="${u.id}">Editar</button>
            <button class="btn-mini danger" data-action="eliminar" data-id="${u.id}">Eliminar</button>
  ` : ``}
</td>

        </tr>
      `).join('');

      main.innerHTML = `
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
          <h2 style="margin:0">Usuarios Registrados</h2>
          <input id="buscar" type="search" placeholder="Buscar por nombre/DNI/email"
                 style="padding:8px; border-radius:8px; border:1px solid #ddd; min-width:260px" value="${esc(q)}"/>
          <select id="filtroKit"
            style="padding:8px; border-radius:8px; border:1px solid #ddd;">
            <option value="" ${filtroActual.kit===''?'selected':''}>Todos</option>
            <option value="pendiente" ${filtroActual.kit==='pendiente'?'selected':''}>Kit pendiente</option>
            <option value="retirado" ${filtroActual.kit==='retirado'?'selected':''}>Kit retirado</option>
          </select>


          <button id="exportarCsv" type="button"
                  style="padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer">
            Exportar CSV
          </button>
          ${canWrite ? `
            <button id="btnNuevo" type="button"
              style="padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer">
              Nuevo
            </button>
` : ``}


          <span style="opacity:.7">Total: ${data.total}</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>DNI</th>
              <th>Email</th>
              <th>Distancia</th>
              <th>Fecha inscripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${filas || `<tr><td colspan="6" style="text-align:center; padding:20px;">Sin datos</td></tr>`}
          </tbody>
        </table>
        
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;">
  <div style="opacity:.75">
    Página <strong>${currentPage}</strong> de <strong>${totalPages}</strong> — Total: ${total}
  </div>

  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <button id="btnPrev" class="btn-mini" ${hasPrev ? '' : 'disabled'}>Anterior</button>

    <select id="pageSelect" class="btn-mini" style="padding:8px 10px;">
      ${Array.from({length: totalPages}).map((_,i)=>`
        <option value="${i+1}" ${i+1===currentPage?'selected':''}>${i+1}</option>
      `).join('')}
    </select>

    <button id="btnNext" class="btn-mini" ${hasNext ? '' : 'disabled'}>Siguiente</button>

    <select id="pageSizeSelect" class="btn-mini" style="padding:8px 10px;">
      ${[10,20,50,100].map(s=>`
        <option value="${s}" ${s===pageSize?'selected':''}>${s} por página</option>
      `).join('')}
    </select>
  </div>
</div>

      `;

      document.getElementById('buscar').addEventListener('change', e =>
        cargarInscripciones({ q: e.target.value, page: 1, pageSize })
      );

      document.getElementById('exportarCsv').addEventListener('click', () =>
        exportarCSV({ q: filtroActual.q })
      );

      document.getElementById('btnNuevo')?.addEventListener('click', () => {
        renderCrearInscripcion();
      });

      document.getElementById('filtroKit')?.addEventListener('change', (e) => {
        filtroActual.kit = e.target.value; // '' | 'pendiente' | 'retirado'
        cargarInscripciones({ q: filtroActual.q, page: 1, pageSize });
      });


      // ✅ (AGREGADO MÍNIMO) Delegación de eventos para botones CRUD
      document.querySelector('#main-content tbody')?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action][data-id]');
        if (!btn) return;
        onAccionUsuario(btn.dataset.action, Number(btn.dataset.id));
      });
      
      document.getElementById('btnPrev')?.addEventListener('click', () => {
        if (currentPage > 1) cargarInscripciones({ q: filtroActual.q, page: currentPage - 1, pageSize });
        });

    document.getElementById('btnNext')?.addEventListener('click', () => {
        if (currentPage < totalPages) cargarInscripciones({ q: filtroActual.q, page: currentPage + 1, pageSize });
        });

    document.getElementById('pageSelect')?.addEventListener('change', (e) => {
        const p = Number(e.target.value || 1);
        cargarInscripciones({ q: filtroActual.q, page: p, pageSize });
        });

    document.getElementById('pageSizeSelect')?.addEventListener('change', (e) => {
        const newSize = Number(e.target.value || 20);
        cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: newSize });
        });


    } catch (err) {
      main.innerHTML = `<h2>Usuarios Registrados</h2><p style="color:#b00020">Error: ${esc(err.message)}</p>`;
    }
  }

  // ========= Exportar CSV =========
  async function exportarCSV({ q = '' } = {}) {
    try {
      const pageSize = 200;
      let page = 1, items = [], total = 0;

      do {
        const url = `${LISTAR_URL}?limit=${pageSize}&offset=${(page-1)*pageSize}&q=${encodeURIComponent(q)}&kit=${encodeURIComponent(filtroActual.kit || '')}&sort=${filtroActual.sort}&order=${filtroActual.order}`;
        const res = await fetch(url, { credentials: 'include' });
        const ct = res.headers.get('content-type') || '';
        const data = ct.includes('application/json') ? await res.json()
                                                     : { success:false, message: await res.text() };

        if (!res.ok || !data.success) throw new Error(data.message || 'Error al obtener datos');
        items = items.concat(data.items || []);
        total = data.total || 0;
        page++;
      } while (items.length < total);

      const csv = construirCSV(items);
      descargarArchivo(csv, `inscripciones${q ? '_'+limpiarNombre(q) : ''}_${hoyYYYYMMDD()}.csv`);
    } catch (e) {
      alert('No se pudo exportar: ' + e.message);
    }
  }

  function construirCSV(items) {
    const header = ['Nombre','DNI','Email','Carrera','Fecha_inscripcion'];
    const filas = items.map(u => [
      u.nombre ?? '',
      u.dni ?? '',
      u.email ?? '',
      u.carrera ?? '',
      formatearFechaISO(u.fecha_inscripcion)
    ].map(csvEscape).join(','));

    return '\uFEFF' + header.join(',') + '\r\n' + filas.join('\r\n');
  }

  function descargarArchivo(contenido, nombre) {
    const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ========= Utilidades =========
  function formatearFecha(f){ const d=new Date(f); return isNaN(d)?'':d.toLocaleString(); }
  function formatearFechaISO(f){
    const d=new Date(f); if(isNaN(d)) return '';
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function csvEscape(v){
    const s=String(v ?? '');
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }
  function hoyYYYYMMDD(){
    const d=new Date(); const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function limpiarNombre(s){ return String(s).replace(/[^a-z0-9_-]+/gi,'_').slice(0,40); }
  function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

  // ✅ (AGREGADO MÍNIMO) Estilos para botones mini (solo si no existen)
  (function addMiniBtnStyles(){
    if (document.getElementById('mini-btn-styles')) return;
    const css = `
      .btn-mini{padding:6px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;margin-right:6px}
      .btn-mini.danger{border-color:#ffb4b4}
    `;
    const s=document.createElement('style');
    s.id='mini-btn-styles';
    s.textContent=css;
    document.head.appendChild(s);
  })();

  // ✅ (AGREGADO MÍNIMO) Funciones CRUD
  async function onAccionUsuario(action, id){
    if (action === 'ver') return verInscripcion(id);
    if (action === 'editar') return editarInscripcion(id);
    if (action === 'eliminar') return eliminarInscripcion(id);
  }

  async function verInscripcion(id){
  const main = document.getElementById('main-content');
  main.innerHTML = `<h2>Ver inscripción</h2><p style="opacity:.8">Cargando...</p>`;

  try {
    const res = await fetch(`/api/inscripcion_get.php?id=${id}`, { credentials:'include' });
    const data = await res.json().catch(()=> ({}));
    if (!res.ok || !data.success) throw new Error(data.message || 'Error al traer inscripción');

    renderDetalleInscripcion(data.item);

  } catch (e) {
    main.innerHTML = `
      <h2>Ver inscripción</h2>
      <p style="color:#b00020">Error: ${esc(e.message)}</p>
      <button id="btnVolverListado" class="btn-mini">Volver</button>
    `;
    document.getElementById('btnVolverListado')?.addEventListener('click', () => {
      cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
    });
  }
}


  async function editarInscripcion(id){
  const res = await fetch(`/api/inscripcion_get.php?id=${id}`, {
    credentials: 'include'
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.success) {
    alert(data.message || 'Error al traer inscripción');
    return;
  }

  // En vez de prompts, mostramos la vista Editar
  renderEditarInscripcion(data.item);
}

function abrirModalConfirmacion({ titulo='Confirmar', mensaje='', textoConfirmar='Confirmar', textoCancelar='Cancelar', danger=false }) {
  return new Promise((resolve) => {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';

    backdrop.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="header">
          <span>${esc(titulo)}</span>
          <button class="btn-x" aria-label="Cerrar">✕</button>
        </div>
        <div class="body">
          <p style="margin:0">${esc(mensaje)}</p>
        </div>
        <div class="footer">
          <button class="btn-modal" data-act="cancelar">${esc(textoCancelar)}</button>
          <button class="btn-modal ${danger ? 'danger' : ''}" data-act="confirmar">${esc(textoConfirmar)}</button>
        </div>
      </div>
    `;

    function cerrar(valor){
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
      resolve(valor);
    }

    function onKey(e){
      if (e.key === 'Escape') cerrar(false);
    }

    // Cerrar al clickear afuera
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) cerrar(false);
    });

    // Botones
    backdrop.querySelector('[data-act="cancelar"]').addEventListener('click', () => cerrar(false));
    backdrop.querySelector('[data-act="confirmar"]').addEventListener('click', () => cerrar(true));
    backdrop.querySelector('.btn-x').addEventListener('click', () => cerrar(false));

    document.addEventListener('keydown', onKey);
    document.body.appendChild(backdrop);
  });
}


  async function eliminarInscripcion(id){
  const ok = await abrirModalConfirmacion({
    titulo: 'Eliminar inscripción',
    mensaje: '¿Seguro que querés eliminar esta inscripción? Esta acción no se puede deshacer.',
    textoConfirmar: 'Eliminar',
    textoCancelar: 'Cancelar',
    danger: true
  });

  if (!ok) return;

  try {
    const del = await fetch('/api/inscripcion_delete.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body: JSON.stringify({ id })
    });

    const delData = await del.json().catch(()=> ({}));
    if (!del.ok || !delData.success) {
      alert(delData.message || 'No se pudo eliminar');
      return;
    }

    // refrescar listado (manteniendo filtro)
    cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });

  } catch (e) {
    console.error(e);
    alert('Error de conexión con el servidor');
  }
}

async function toggleKitRetiro(id, value) {
  const msg = value === 1
    ? '¿Confirmar que el usuario retiró el kit?'
    : '¿Desmarcar retiro de kit?';

  if (!confirm(msg)) return;

  const res = await fetch('/api/kit_toggle.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ id, value })
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.success) {
    alert(data.message || 'No se pudo actualizar el estado del kit');
    return;
  }

  // ✅ refrescar trayendo el usuario actualizado
  const get = await fetch(`/api/inscripcion_get.php?id=${id}`, { credentials: 'include' });
  const getData = await get.json().catch(() => ({}));
  if (get.ok && getData.success) {
    renderDetalleInscripcion(getData.item);
  } else {
    // fallback
    cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
  }
}



  function renderDetalleInscripcion(u){
  const main = document.getElementById('main-content');

  const v = (x) => esc(x ?? '');
  const fecha = (x) => v(formatearFecha(x));

  // ✅ permisos según rol (usa lo que ya guardaste en window.__ME__)
  const role = window.__ME__?.role ?? null;
  const canWrite = role === 'admin_total'; // solo admin_total puede editar/eliminar
  const canToggleKit = role === 'admin_total' || role === 'admin_visualizador';

  main.innerHTML = `
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between">
      <h2 style="margin:0">Inscripción #${v(u.id)}</h2>

      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
        <button id="btnVolverListado" class="btn-mini">Volver</button>

        ${canWrite ? `<button id="btnEditarDesdeVer" class="btn-mini">Editar</button>` : ``}
        ${canWrite ? `<button id="btnEliminarDesdeVer" class="btn-mini danger">Eliminar</button>` : ``}
        ${canToggleKit ? `<button id="btnKitToggle" class="btn-mini">Validar retiro kit</button>` : ``}

      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="header">Datos personales</div>
      <div class="content">
        <table class="simple">
          <tbody>
            <tr><th style="width:240px">Nombre</th><td>${v(u.nombre)}</td></tr>
            <tr><th>DNI</th><td>${v(u.dni)}</td></tr>
            <tr><th>Email</th><td>${v(u.email)}</td></tr>
            <tr><th>Fecha nacimiento</th><td>${v(u.fecha_nacimiento)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="header">Inscripción</div>
      <div class="content">
        <table class="simple">
          <tbody>
            <tr><th style="width:240px">Carrera</th><td>${v(u.carrera)}</td></tr>
            <tr><th>Talle remera</th><td>${v(u.talle_remera)}</td></tr>
            <tr><th>Fecha inscripción</th><td>${fecha(u.fecha_inscripcion)}</td></tr>
            <tr><th>Retiro de kit</th><td>${(u.kit_retirado == 1 || u.kit_retirado === true) ? '✅ Retirado' : '❌ Pendiente'}</td></tr>
            <tr><th>Fecha retiro</th><td>${u.kit_retirado_at ? fecha(u.kit_retirado_at) : ''}</td></tr>
            <tr>
  <th>Remera</th>
  <td>${
    (u.remera_asignada == 1 || u.remera_asignada === true)
      ? ((u.remera_retirada == 1 || u.remera_retirada === true) ? '🎽 ✅ Retirada' : '🎽 ❌ Pendiente')
      : '🚫 No recibe remera'
  }</td>
</tr>

          </tbody>

async function guardarEdicionInscripcion(id) {
  const errEl = document.getElementById('ed_error');
  const okEl = document.getElementById('ed_ok');
  if (errEl) errEl.textContent = '';
  if (okEl) okEl.textContent = '';

  const payload = {
    id,
    nombre: document.getElementById('ed_nombre')?.value.trim() || '',
    dni: document.getElementById('ed_dni')?.value.trim() || '',
    email: document.getElementById('ed_email')?.value.trim() || '',
    carrera: document.getElementById('ed_carrera')?.value || '',
    fecha_nacimiento: document.getElementById('ed_fecha_nacimiento')?.value || '',
    talle_remera: document.getElementById('ed_talle_remera')?.value.trim() || '',
    cobertura_medica: document.getElementById('ed_cobertura_medica')?.value.trim() || '',
    numero_afiliado: document.getElementById('ed_numero_afiliado')?.value.trim() || '',
    telefono_emergencia: document.getElementById('ed_telefono_emergencia')?.value.trim() || ''
  };

  // validaciones mínimas
  if (!payload.nombre || !payload.dni || !payload.email || !payload.carrera) {
    if (errEl) errEl.textContent = 'Nombre, DNI, Email y Carrera son obligatorios.';
    return;
  }

  try {
    const up = await fetch('/api/inscripcion_update.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });

    const data = await up.json().catch(() => ({}));
    if (!up.ok || !data.success) {
      if (errEl) errEl.textContent = data.message || 'No se pudo guardar.';
      return;
    }

    if (okEl) okEl.textContent = 'Guardado ✅';

    // traer de nuevo y mostrar "Ver"
    const get = await fetch(`/api/inscripcion_get.php?id=${id}`, { credentials: 'include' });
    const getData = await get.json().catch(() => ({}));
    if (get.ok && getData.success) {
      renderDetalleInscripcion(getData.item);
    } else {
      // si no, al menos refrescamos el listado
      cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
    }

  } catch (e) {
    console.error(e);
    if (errEl) errEl.textContent = 'Error de conexión con el servidor.';
  }
}

  async function importarHistoricoCSV() {
    const fileInput = document.getElementById('csvFile');
    const resultBox = document.getElementById('importResult');

    resultBox.innerHTML = '';

    const file = fileInput.files?.[0];
    if (!file) {
      resultBox.innerHTML = `<p style="color:#b00020;margin:0">Seleccioná un archivo .csv</p>`;
      return;
    }

    const fd = new FormData();
    fd.append('csv', file);

    resultBox.innerHTML = `<p style="margin:0;opacity:.8">Importando...</p>`;

    try {
      const res = await fetch('/api/historico_importar.php', {
        method: 'POST',
        body: fd,
        credentials: 'include'
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.success) {
        resultBox.innerHTML = `<p style="color:#b00020;margin:0">Error: ${esc(data.message || 'No se pudo importar')}</p>`;
        return;
      }

      const inserted = data.inserted ?? 0;
      const errors = Array.isArray(data.errors) ? data.errors : [];

      resultBox.innerHTML = `
        <p style="margin:0;color:#0a7a2f"><strong>OK</strong> Importados: ${inserted}</p>
        ${errors.length ? `
          <details style="margin-top:8px">
            <summary style="cursor:pointer;color:#b00020">Ver errores (${errors.length})</summary>
            <ul style="margin:8px 0 0 18px">
              ${errors.map(e => `<li>${esc(e)}</li>`).join('')}
            </ul>
          </details>
        ` : `<p style="margin:6px 0 0 0;opacity:.8">Sin errores.</p>`}
      `;
      await cargarHistorico({ page: 1 });

    } catch (e) {
      console.error(e);
      resultBox.innerHTML = `<p style="color:#b00020;margin:0">Error de conexión con el servidor</p>`;
    }
  }

  async function cargarHistorico({ page } = {}) {
    const tabla = document.getElementById('histTabla');
    const totalEl = document.getElementById('histTotal');
    const selEd = document.getElementById('filtroEdicion');
    const inputQ = document.getElementById('buscarHistorico');

    if (!tabla || !totalEl || !selEd || !inputQ) return;

    if (page) historicoFiltro.page = page;
    historicoFiltro.q = inputQ.value.trim();
    historicoFiltro.edicion = selEd.value;

    const offset = (historicoFiltro.page - 1) * historicoFiltro.pageSize;

async function renderAdmins() {
  const main = document.getElementById('main-content');

  // chequeo rol desde sesión (frontend)
  const role = window.__ME__?.role;
  if (role !== 'admin_total') {
    main.innerHTML = `
      <h2>Administrar usuarios</h2>
      <p style="color:#b00020">No tenés permisos para acceder a esta pantalla.</p>
    `;
    return;
  }

  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0">Administrar usuarios (Admins)</h2>
      <span style="opacity:.7">Solo admin_total</span>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="header">Crear admin</div>
      <div class="content">
        <form id="formCrearAdmin" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input name="username" placeholder="username" required
                 style="padding:10px;border:1px solid #ddd;border-radius:10px" />
          <input name="password" type="password" placeholder="password" required
                 style="padding:10px;border:1px solid #ddd;border-radius:10px" />
          <select name="role" style="padding:10px;border:1px solid #ddd;border-radius:10px">
            <option value="admin_total">admin_total</option>
            <option value="admin_visualizador" selected>admin_visualizador</option>
            <option value="admin_externo">admin_externo (solo 10k)</option>
          </select>
          <button class="btn-mini" type="submit">Crear</button>
          <span id="adminsMsg" style="margin-left:8px"></span>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="header">Admins existentes</div>
      <div class="content">
        <div id="adminsTabla">Cargando...</div>
      </div>
    </div>
  `;

  await cargarAdminsTabla();

  // Crear
  document.getElementById('formCrearAdmin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('adminsMsg');
    msg.textContent = '';
    msg.style.color = '';

    const fd = new FormData(e.target);
    const payload = {
      username: (fd.get('username') || '').toString().trim(),
      password: (fd.get('password') || '').toString(),
      role: (fd.get('role') || 'admin_visualizador').toString()
    };

    try {
      const res = await fetch('/api/admins_create.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        credentials: 'include',
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(()=> ({}));

      if (!res.ok || !data.ok) throw new Error(data.message || 'No se pudo crear');

      msg.style.color = '#0a7a2f';
      msg.textContent = 'Admin creado ✅';
      e.target.reset();
      await cargarAdminsTabla();
    } catch (err) {
      msg.style.color = '#b00020';
      msg.textContent = err.message;
    }
  });
}

async function cargarAdminsTabla(){
  const box = document.getElementById('adminsTabla');
  if (!box) return;
  box.textContent = 'Cargando...';

  try {
    const res = await fetch('/api/admins_list.php', { credentials:'include' });
    const data = await res.json().catch(()=> ({}));

    if (!res.ok || !data.ok) throw new Error(data.message || 'No se pudo listar');

    const items = Array.isArray(data.items) ? data.items : [];

    const rows = items.map(a => `
      <tr>
        <td>${esc(a.id)}</td>
        <td>${esc(a.username)}</td>
        <td>${esc(a.role || '')}</td>
        <td>${esc(a.scope_kit || '')}</td>
        <td>${a.is_active == 1 ? 'Sí' : 'No'}</td>
        <td>${esc(a.created_at || '')}</td>
        <td style="white-space:nowrap">
          <button class="btn-mini" data-admin-action="pass" data-id="${a.id}" data-username="${esc(a.username)}">
            Cambiar pass
          </button>
          <button class="btn-mini danger" data-admin-action="delete" data-id="${a.id}" data-username="${esc(a.username)}">
            Eliminar
          </button>
        </td>
      </tr>
    `).join('');

    box.innerHTML = `
      <table class="simple">
        <thead>
          <tr>
            <th>ID</th><th>Username</th><th>Rol</th><th>Scope</th><th>Activo</th><th>Creado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="7" style="padding:16px;text-align:center">Sin admins</td></tr>`}
        </tbody>
      </table>
    `;

    // Delegación de eventos (una sola vez)
    box.querySelector('table')?.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-admin-action][data-id]');
      if (!btn) return;

      const action = btn.dataset.adminAction;
      const id = Number(btn.dataset.id);
      const username = btn.dataset.username || '';

      if (action === 'pass') {
        await uiCambiarPasswordAdmin({ id, username });
      }

      if (action === 'delete') {
        await uiEliminarAdmin({ id, username });
      }
    });

  } catch (e) {
    box.innerHTML = `<p style="color:#b00020;margin:0">Error: ${esc(e.message)}</p>`;
  }
}

async function uiCambiarPasswordAdmin({ id, username }) {
  const newPass = prompt(`Nueva contraseña para "${username}" (mínimo 6 caracteres):`);
  if (newPass == null) return; // cancel
  if (newPass.trim().length < 6) {
    alert('La contraseña debe tener al menos 6 caracteres.');
    return;
  }

  try {
    const res = await fetch('/api/admins_update_password.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ id, password: newPass })
    });

    const data = await res.json().catch(()=> ({}));
    if (!res.ok || !data.ok) throw new Error(data.message || 'No se pudo actualizar la contraseña');

    alert('Contraseña actualizada ✅');
  } catch (e) {
    alert(e.message);
  }
}

async function uiEliminarAdmin({ id, username }) {
  // opcional: evitar borrarte a vos misma/o
  const myId = window.__ME__?.id;
  if (myId && Number(myId) === Number(id)) {
    alert('No podés eliminar tu propio usuario mientras estás logueado.');
    return;
  }

  const ok = confirm(`¿Eliminar (desactivar) al admin "${username}"?`);
  if (!ok) return;

  try {
    const res = await fetch('/api/admins_delete.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ id })
    });

    const data = await res.json().catch(()=> ({}));
    if (!res.ok || !data.ok) throw new Error(data.message || 'No se pudo eliminar');

    alert('Admin eliminado (desactivado) ✅');
    await cargarAdminsTabla();
  } catch (e) {
    alert(e.message);
  }
}

function renderLectorQR(){
  const main = document.getElementById('main-content');

  main.innerHTML = `
    <h2>Escanear QR (token cifrado)</h2>

    <div class="card" style="margin-top:16px">
      <div class="header">Escanear con cámara</div>
      <div class="content">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px">
          <button id="btnStartScan" class="btn-mini">Iniciar cámara</button>
          <button id="btnStopScan" class="btn-mini" disabled>Detener</button>
          <select id="cameraSelect" class="btn-mini" style="padding:8px 10px"></select>
          <span id="scanStatus" style="opacity:.75"></span>
        </div>

        <div id="qrReader" style="width:min(420px,100%);"></div>

        <div id="scanResult" style="margin-top:12px"></div>
      </div>
    </div>
  `;

  initQrScanner();
}

let __qrScanner = null;

async function initQrScanner(){
  const btnStart = document.getElementById('btnStartScan');
  const btnStop  = document.getElementById('btnStopScan');
  const statusEl = document.getElementById('scanStatus');
  const resultEl = document.getElementById('scanResult');
  const cameraSel = document.getElementById('cameraSelect');

  if (!btnStart || !btnStop || !statusEl || !resultEl || !cameraSel) return;

  resultEl.innerHTML = '';
  statusEl.textContent = 'Listo para escanear.';

  // Asegura que la lib esté cargada
  if (typeof Html5Qrcode === 'undefined') {
    statusEl.textContent = 'No cargó la librería de cámara (html5-qrcode).';
    statusEl.style.color = '#b00020';
    return;
  }

  // listar cámaras
  try {
    const devices = await Html5Qrcode.getCameras();
    cameraSel.innerHTML = '';

    if (!devices || devices.length === 0) {
      statusEl.textContent = 'No se encontraron cámaras disponibles.';
      statusEl.style.color = '#b00020';
      return;
    }

    devices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.label || `Cámara ${i+1}`;
      cameraSel.appendChild(opt);
    });
  } catch (e) {
    statusEl.textContent = 'No se pudo acceder a cámaras (permiso denegado o no disponible).';
    statusEl.style.color = '#b00020';
    return;
  }

  btnStart.addEventListener('click', async () => {
    resultEl.innerHTML = '';
    statusEl.style.color = '';
    statusEl.textContent = 'Iniciando cámara...';

    // evita doble start
    if (__qrScanner) {
      try { await __qrScanner.stop(); } catch {}
      __qrScanner = null;
    }

    __qrScanner = new Html5Qrcode("qrReader");
    const cameraId = cameraSel.value;

    btnStart.disabled = true;
    btnStop.disabled = false;

    try {
      await __qrScanner.start(
        cameraId,
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async (decodedText) => {
          // ✅ detectó QR
          statusEl.textContent = 'QR detectado. Validando...';

          // evitar leer 20 veces el mismo QR
          await detenerScannerSilencioso();

          // acá validamos en backend
          await validarTokenQR(decodedText);
        },
        () => {
          // onScanFailure: lo dejamos silencioso
        }
      );

      statusEl.textContent = 'Cámara activa. Apuntá al QR...';
    } catch (e) {
      btnStart.disabled = false;
      btnStop.disabled = true;
      statusEl.textContent = 'Error iniciando cámara: ' + (e?.message || e);
      statusEl.style.color = '#b00020';
    }
  });

  btnStop.addEventListener('click', async () => {
    await detenerScannerSilencioso();
    statusEl.textContent = 'Escaneo detenido.';
    btnStart.disabled = false;
    btnStop.disabled = true;
  });

  async function detenerScannerSilencioso(){
    if (!__qrScanner) return;
    try { await __qrScanner.stop(); } catch {}
    try { await __qrScanner.clear(); } catch {}
    __qrScanner = null;
  }

  async function validarTokenQR(token){
  const resultEl = document.getElementById('scanResult');
  const statusEl = document.getElementById('scanStatus');
  const btnStart = document.getElementById('btnStartScan');
  const btnStop  = document.getElementById('btnStopScan');

  resultEl.innerHTML = '';

  try {
    // 1) Decodificar token -> traer inscripción
    const res = await fetch('/api/qr_decode.php', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      credentials: 'include',
      body: JSON.stringify({ token })
    });

    const data = await res.json().catch(()=> ({}));
    if (!res.ok || !data.success) throw new Error(data.message || 'No se pudo leer el QR');

    const item = data.item;
    const id = Number(item?.id || 0);
    if (!id) throw new Error('Inscripción inválida');

    // 2) Validar kit (setear retirado=1)
    // Si ya lo tenés retirado, podés frenar acá o permitir "desmarcar".
    const yaRetiro = (item.kit_retirado == 1 || item.kit_retirado === true);
    if (yaRetiro) {
      resultEl.innerHTML = `
        <p style="color:#0a7a2f;margin:0"><strong>OK</strong> Este QR ya estaba validado ✅</p>
        <div style="margin-top:12px">
          <button id="btnScanAgain" class="btn-mini">Escanear otro</button>
          <button id="btnVerFicha" class="btn-mini">Ver ficha</button>
        </div>
      `;
      document.getElementById('btnScanAgain')?.addEventListener('click', () => {
        statusEl.textContent = 'Listo para escanear.';
        btnStart.disabled = false;
        btnStop.disabled = true;
      });
      document.getElementById('btnVerFicha')?.addEventListener('click', () => {
        renderDetalleInscripcion(item);
      });
      return;
    }

    const upd = await fetch('/api/kit_toggle.php', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      credentials: 'include',
      body: JSON.stringify({ id, value: 1 })
    });

    const updData = await upd.json().catch(()=> ({}));
    if (!upd.ok || !updData.success) {
      throw new Error(updData.message || 'No se pudo validar el kit');
    }

    // 3) Traer de nuevo la ficha actualizada (opcional pero recomendable)
    const get = await fetch(`/api/inscripcion_get.php?id=${id}`, { credentials:'include' });
    const getData = await get.json().catch(()=> ({}));
    const updated = (get.ok && getData.success) ? getData.item : item;

    statusEl.textContent = 'Kit validado ✅';

    // mostrar ficha y botón escanear otro
    renderDetalleInscripcion(updated);

    // opcional: pequeño mensaje arriba o abajo
    // (si querés mostrar en la misma pantalla del scanner en vez de renderDetalleInscripcion, decime)
    
  } catch (e) {
    resultEl.innerHTML = `
      <p style="color:#b00020;margin:0">Error: ${esc(e.message || e)}</p>
      <div style="margin-top:12px">
        <button id="btnScanAgain" class="btn-mini">Reintentar</button>
      </div>
    `;
    document.getElementById('btnScanAgain')?.addEventListener('click', () => {
      btnStart.disabled = false;
      btnStop.disabled = true;
      statusEl.textContent = 'Listo para escanear.';
    });
  }
}

}

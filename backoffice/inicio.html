/* ===== Estilos adicionales para el escáner de QR ===== */
#qr-reader {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 20px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  background: white;
  padding: 15px;
}
.result-box {
  min-height: 80px;
  margin: 20px auto;
  max-width: 500px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;
}
.result-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
.result-error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
.result-warning { background-color: #fff3cd; border-color: #ffeeba; color: #856404; }
.instructions {
  background: #e9f7fe;
  border-left: 4px solid #2196f3;
  padding: 12px 15px;
  margin: 20px 0;
  border-radius: 0 8px 8px 0;
}
.kit-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 20px 0;
}
.stat-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-top: 4px solid #007bff;
}
.stat-card.retirados { border-top-color: #28a745; }
.stat-card.pendientes { border-top-color: #ffc107; }
.stat-number {
  font-size: 2.2rem;
  font-weight: 700;
  margin: 8px 0;
}
.stat-label {
  color: #6c757d;
  font-size: 0.95rem;
}
.manual-input {
  margin-top: 20px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 12px;
}
/* Asegurar compatibilidad con dispositivos móviles */
@media (max-width: 768px) {
  #qr-reader { max-width: 100%; }
  .kit-stats { grid-template-columns: 1fr; }
}
</style>

// ======================================================
// NUEVO: RETIRAR KITS (ESCÁNER QR)
// ======================================================
async function renderRetirarKits() {
const main = document.getElementById('main-content');
main.innerHTML = `
<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
<h2 style="margin:0"><i class="fas fa-qrcode me-2"></i>Retiro de Kits de Participantes</h2>
<a href="#" id="btnVolverDashboard" class="btn-mini" style="padding:8px 16px;">
<i class="fas fa-arrow-left me-1"></i>Volver
</a>
</div>

<div class="instructions">
<i class="fas fa-info-circle me-2 text-primary"></i>
<strong>Instrucciones:</strong> Permite el acceso a la cámara y escanea el QR del participante para confirmar la entrega de su kit. 
El QR debe contener un token válido generado al momento de la inscripción.
</div>

<div class="kit-stats">
<div class="stat-card">
<div class="stat-number" id="total-participantes">0</div>
<div class="stat-label">Total participantes</div>
</div>
<div class="stat-card retirados">
<div class="stat-number" id="kits-retirados">0</div>
<div class="stat-label">Kits retirados</div>
</div>
<div class="stat-card pendientes">
<div class="stat-number" id="kits-pendientes">0</div>
<div class="stat-label">Kits pendientes</div>
</div>
</div>

<div id="qr-reader"></div>
<div class="result-box" id="result-message">
<i class="fas fa-info-circle me-2"></i>Escanea el QR del participante para comenzar...
</div>

<div class="manual-input">
<h4 style="margin:0 0 12px 0"><i class="fas fa-keyboard me-2"></i>Ingreso Manual (si falla el escaneo)</h4>
<div style="display:flex; gap:10px; flex-wrap:wrap;">
<input type="text" id="manual-token" placeholder="Pega aquí el token del QR (ej: a1b2c3d4...)" 
style="flex:1; min-width:200px; padding:10px; border-radius:8px; border:1px solid #ddd;">
<button id="manual-submit" class="btn-mini" style="padding:10px 16px;">
<i class="fas fa-check me-1"></i>Confirmar
</button>
</div>
<p style="margin-top:8px; font-size:0.85rem; color:#6c757d;">
<i class="fas fa-exclamation-triangle me-1 text-warning"></i>
Solo para casos de emergencia. El escaneo QR es el método recomendado.
</p>
</div>
`;

// Cargar estadísticas iniciales
cargarEstadisticasKits();

// Inicializar el escáner QR
iniciarEscannerQR();

// Eventos de navegación
document.getElementById('btnVolverDashboard')?.addEventListener('click', () => {
renderDashboard();
});

// Evento para ingreso manual
document.getElementById('manual-submit')?.addEventListener('click', () => {
procesarTokenManual();
});

document.getElementById('manual-token')?.addEventListener('keypress', (e) => {
if (e.key === 'Enter') procesarTokenManual();
});
}

function cargarEstadisticasKits() {
Promise.all([
fetch('../api/listar_inscripciones.php?limit=1&offset=0', { credentials: 'include' }).then(r => r.json()),
fetch('../api/listar_inscripciones.php?kit=retirado&limit=1&offset=0', { credentials: 'include' }).then(r => r.json()),
fetch('../api/listar_inscripciones.php?kit=pendiente&limit=1&offset=0', { credentials: 'include' }).then(r => r.json())
])
.then(([total, retirados, pendientes]) => {
document.getElementById('total-participantes').textContent = total.total || 0;
document.getElementById('kits-retirados').textContent = retirados.total || 0;
document.getElementById('kits-pendientes').textContent = pendientes.total || 0;
})
.catch(err => console.error('Error cargando estadísticas:', err));
}

function iniciarEscannerQR() {
const qrReader = document.getElementById('qr-reader');
const resultBox = document.getElementById('result-message');

try {
const html5QrcodeScanner = new Html5QrcodeScanner(
"qr-reader",
{ fps: 10, qrbox: 250, aspectRatio: 1 },
false
);

html5QrcodeScanner.render(
(decodedText) => {
procesarQR(decodedText);
},
(errorMessage) => {
if (errorMessage.includes('Permission denied')) {
mostrarResultado('⚠️ Permite el acceso a la cámara para usar el escáner', 'warning');
}
}
);
} catch (e) {
resultBox.innerHTML = `
<div style="padding:20px; text-align:center; color:#721c24;">
<i class="fas fa-camera-slash fa-2x mb-2"></i>
<p>No se pudo iniciar la cámara. Prueba en otro navegador o usa el ingreso manual.</p>
<p style="font-size:0.9rem; margin-top:8px; color:#6c757d;">Error: ${e.message}</p>
</div>
`;
}
}

function mostrarResultado(mensaje, tipo = 'info') {
const resultBox = document.getElementById('result-message');
resultBox.className = 'result-box';
resultBox.innerHTML = mensaje;

switch(tipo) {
case 'success':
resultBox.classList.add('result-success');
break;
case 'error':
resultBox.classList.add('result-error');
break;
case 'warning':
resultBox.classList.add('result-warning');
break;
}

// Limpiar mensaje después de 5 segundos para éxitos
if (tipo === 'success') {
setTimeout(() => {
if (resultBox.classList.contains('result-success')) {
resultBox.className = 'result-box';
resultBox.innerHTML = '<i class="fas fa-info-circle me-2"></i>Escanea el QR del participante para comenzar...';
}
}, 5000);
}
}

async function procesarQR(decodedText) {
mostrarResultado('<i class="fas fa-spinner fa-spin me-2"></i>Procesando escaneo...', 'info');

try {
const qrData = JSON.parse(decodedText);
if (!qrData.token || typeof qrData.token !== 'string') {
throw new Error('Formato de QR inválido. Debe contener un token');
}

const res = await fetch('../api/kit_toggle.php', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
credentials: 'include',
body: JSON.stringify({ qr_data: decodedText })
});

const data = await res.json();

if (!res.ok || !data.success) {
throw new Error(data.message || 'No se pudo procesar el retiro del kit');
}

mostrarResultado(`
<i class="fas fa-check-circle text-success fa-2x mb-2"></i>
<div style="margin-top:8px;">
<strong>¡Kit entregado correctamente!</strong><br>
Participante ID: ${data.participante_id}<br>
${new Date().toLocaleTimeString()}
</div>
`, 'success');

// Actualizar estadísticas
cargarEstadisticasKits();

// Intentar sonido de confirmación
try {
new Audio('https://assets.mixkit.co/sounds/preview/mixkit-winning-chimes-2015.mp3').play();
} catch (e) {
console.log('Sonido no disponible:', e);
}

} catch (e) {
console.error('Error procesando QR:', e);
mostrarResultado(`
<i class="fas fa-exclamation-triangle text-warning fa-2x mb-2"></i>
<div style="margin-top:8px;">
<strong>Error al procesar QR:</strong><br>
${e.message}
</div>
`, 'error');
}
}

async function procesarTokenManual() {
const tokenInput = document.getElementById('manual-token');
const token = tokenInput.value.trim();

if (!token) {
mostrarResultado('Ingrese un token válido', 'warning');
return;
}

try {
// Validar formato básico
if (token.length !== 32 || !/^[a-f0-9]+$/.test(token.toLowerCase())) {
throw new Error('Token inválido. Debe ser alfanumérico de 32 caracteres');
}

const manualData = JSON.stringify({ token: token.toLowerCase() });
tokenInput.value = '';
mostrarResultado('<i class="fas fa-spinner fa-spin me-2"></i>Procesando ingreso manual...', 'info');

const res = await fetch('../api/kit_toggle.php', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
credentials: 'include',
body: JSON.stringify({ qr_data: manualData })
});

const data = await res.json();

if (!res.ok || !data.success) {
throw new Error(data.message || 'No se pudo procesar el retiro del kit');
}

mostrarResultado(`
<i class="fas fa-check-circle text-success fa-2x mb-2"></i>
<div style="margin-top:8px;">
<strong>¡Kit entregado correctamente! (Manual)</strong><br>
Participante ID: ${data.participante_id}<br>
${new Date().toLocaleTimeString()}
</div>
`, 'success');

// Actualizar estadísticas
cargarEstadisticasKits();

} catch (e) {
console.error('Error procesando token manual:', e);
mostrarResultado(`
<i class="fas fa-exclamation-triangle text-warning fa-2x mb-2"></i>
<div style="margin-top:8px;">
<strong>Error:</strong><br>
${e.message}
</div>
`, 'error');
}
}

// ======================================================
// LISTADO INSCRIPCIONES + CSV
// ======================================================
const LISTAR_URL = '../api/listar_inscripciones.php';
let filtroActual = { q: '', sort: 'fecha_inscripcion', order: 'desc', kit: '' };

style="padding:8px; border-radius:8px; border:1px solid #ddd;">

</select>
<button id="exportarCsv" type="button"
style="padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer">
Exportar CSV
</button>
<button id="btnNuevo" type="button"
style="padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer">
Nuevo
</button>
<span style="opacity:.7">Total: ${data.total}</span>
</div>
<table>
<thead>
<tr>
<th>Nombre</th>
<th>DNI</th>
<th>Email</th>
<th>Distancia</th>
<th>Fecha inscripción</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
${filas || `<tr><td colspan="6" style="text-align:center; padding:20px;">Sin datos</td></tr>`}
</tbody>

`;
document.getElementById('buscar').addEventListener('change', e =>
cargarInscripciones({ q: e.target.value, page: 1, pageSize })
);
document.getElementById('exportarCsv').addEventListener('click', () =>

document.getElementById('btnNuevo')?.addEventListener('click', () => {
renderCrearInscripcion();
});
document.getElementById('filtroKit')?.addEventListener('change', (e) => {
filtroActual.kit = e.target.value; // '' | 'pendiente' | 'retirado'
cargarInscripciones({ q: filtroActual.q, page: 1, pageSize });
});
// ✅ (AGREGADO MÍNIMO) Delegación de eventos para botones CRUD
document.querySelector('#main-content tbody')?.addEventListener('click', (e) => {
const btn = e.target.closest('button[data-action][data-id]');
if (!btn) return;
onAccionUsuario(btn.dataset.action, Number(btn.dataset.id));

} catch (err) {
main.innerHTML = `<h2>Usuarios Registrados</h2><p style="color:#b00020">Error: ${esc(err.message)}</p>`;

// ========= Exportar CSV =========
async function exportarCSV({ q = '' } = {}) {
try {
const pageSize = 200;
let page = 1, items = [], total = 0;
do {
const url = `${LISTAR_URL}?limit=${pageSize}&offset=${(page-1)*pageSize}&q=${encodeURIComponent(q)}&kit=${encodeURIComponent(filtroActual.kit || '')}&sort=${filtroActual.sort}&order=${filtroActual.order}`;
const res = await fetch(url, { credentials: 'include' });
const ct = res.headers.get('content-type') || '';
const data = ct.includes('application/json') ? await res.json()
: { success:false, message: await res.text() };
if (!res.ok || !data.success) throw new Error(data.message || 'Error al obtener datos');
items = items.concat(data.items || []);
total = data.total || 0;
page++;
} while (items.length < total);
const csv = construirCSV(items);
descargarArchivo(csv, `inscripciones${q ? '_'+limpiarNombre(q) : ''}_${hoyYYYYMMDD()}.csv`);
} catch (e) {
alert('No se pudo exportar: ' + e.message);
}
}

function construirCSV(items) {
const header = ['Nombre','DNI','Email','Carrera','Fecha_inscripcion'];
const filas = items.map(u => [
u.nombre ?? '',
u.dni ?? '',
u.email ?? '',
u.carrera ?? '',
formatearFechaISO(u.fecha_inscripcion)
].map(csvEscape).join(','));
return '\uFEFF' + header.join(',') + '\r\n' + filas.join('\r\n');
}

function descargarArchivo(contenido, nombre) {
const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = nombre;
document.body.appendChild(a);
a.click();
a.remove();
URL.revokeObjectURL(url);
}

// ========= Utilidades =========
function formatearFecha(f){ const d=new Date(f); return isNaN(d)?'':d.toLocaleString(); }
function formatearFechaISO(f){
const d=new Date(f); if(isNaN(d)) return '';
const p=n=>String(n).padStart(2,'0');
return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function csvEscape(v){
const s=String(v ?? '');
return /[\",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function hoyYYYYMMDD(){
const d=new Date(); const p=n=>String(n).padStart(2,'0');
return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function limpiarNombre(s){ return String(s).replace(/[^a-z0-9_-]+/gi,'_').slice(0,40); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

function abrirModalConfirmacion({ titulo='Confirmar', mensaje='', textoConfirmar='Confirmar', textoCancelar='Cancelar', danger=false }) {
return new Promise((resolve) => {
const backdrop = document.createElement('div');
backdrop.className = 'modal-backdrop';
backdrop.innerHTML = `
<div class="modal" role="dialog" aria-modal="true">
<div class="header">
<span>${esc(titulo)}</span>
<button class="btn-x" aria-label="Cerrar">✕</button>
</div>
<div class="body">
<p style="margin:0">${esc(mensaje)}</p>
</div>
<div class="footer">
<button class="btn-modal" data-act="cancelar">${esc(textoCancelar)}</button>
<button class="btn-modal ${danger ? 'danger' : ''}" data-act="confirmar">${esc(textoConfirmar)}</button>
</div>
</div>
`;
function cerrar(valor){
backdrop.remove();
document.removeEventListener('keydown', onKey);
resolve(valor);
}
function onKey(e){
if (e.key === 'Escape') cerrar(false);
}
// Cerrar al clickear afuera
backdrop.addEventListener('click', (e) => {
if (e.target === backdrop) cerrar(false);
});
// Botones
backdrop.querySelector('[data-act="cancelar"]').addEventListener('click', () => cerrar(false));
backdrop.querySelector('[data-act="confirmar"]').addEventListener('click', () => cerrar(true));
backdrop.querySelector('.btn-x').addEventListener('click', () => cerrar(false));
document.addEventListener('keydown', onKey);
document.body.appendChild(backdrop);
});
}

async function eliminarInscripcion(id){
const ok = await abrirModalConfirmacion({
titulo: 'Eliminar inscripción',
mensaje: '¿Seguro que querés eliminar esta inscripción? Esta acción no se puede deshacer.',
textoConfirmar: 'Eliminar',
textoCancelar: 'Cancelar',
danger: true
});
if (!ok) return;
try {
const del = await fetch('../api/inscripcion_delete.php', {
method:'POST',
headers:{'Content-Type':'application/json'},
credentials:'include',
body: JSON.stringify({ id })
});
const delData = await del.json().catch(()=> ({}));
if (!del.ok || !delData.success) {
alert(delData.message || 'No se pudo eliminar');
return;
}
// refrescar listado (manteniendo filtro)
cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
} catch (e) {
console.error(e);
alert('Error de conexión con el servidor');
}
}

async function toggleKitRetiro(id, value) {
const msg = value === 1
? '¿Confirmar que el usuario retiró el kit?'
: '¿Desmarcar retiro de kit?';
if (!confirm(msg)) return;
const res = await fetch('../api/kit_toggle.php', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
credentials: 'include',
body: JSON.stringify({ id, value })
});
const data = await res.json().catch(() => ({}));
if (!res.ok || !data.success) {
alert(data.message || 'No se pudo actualizar el estado del kit');
return;
}
// ✅ refrescar trayendo el usuario actualizado
const get = await fetch(`../api/inscripcion_get.php?id=${id}`, { credentials: 'include' });
const getData = await get.json().catch(() => ({}));
if (get.ok && getData.success) {
renderDetalleInscripcion(getData.item);
} else {
// fallback
cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
}
}

async function guardarEdicionInscripcion(id) {
const errEl = document.getElementById('ed_error');
const okEl = document.getElementById('ed_ok');
if (errEl) errEl.textContent = '';
if (okEl) okEl.textContent = '';
const payload = {
id,
nombre: document.getElementById('ed_nombre')?.value.trim() || '',
dni: document.getElementById('ed_dni')?.value.trim() || '',
email: document.getElementById('ed_email')?.value.trim() || '',
carrera: document.getElementById('ed_carrera')?.value || '',
fecha_nacimiento: document.getElementById('ed_fecha_nacimiento')?.value || '',
talle_remera: document.getElementById('ed_talle_remera')?.value.trim() || '',
cobertura_medica: document.getElementById('ed_cobertura_medica')?.value.trim() || '',
numero_afiliado: document.getElementById('ed_numero_afiliado')?.value.trim() || '',
telefono_emergencia: document.getElementById('ed_telefono_emergencia')?.value.trim() || ''
};
// validaciones mínimas
if (!payload.nombre || !payload.dni || !payload.email || !payload.carrera) {
if (errEl) errEl.textContent = 'Nombre, DNI, Email y Carrera son obligatorios.';
return;
}
try {
const up = await fetch('../api/inscripcion_update.php', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
credentials: 'include',
body: JSON.stringify(payload)
});
const data = await up.json().catch(() => ({}));
if (!up.ok || !data.success) {
if (errEl) errEl.textContent = data.message || 'No se pudo guardar.';
return;
}
if (okEl) okEl.textContent = 'Guardado ✅';
// traer de nuevo y mostrar "Ver"
const get = await fetch(`../api/inscripcion_get.php?id=${id}`, { credentials: 'include' });
const getData = await get.json().catch(() => ({}));
if (get.ok && getData.success) {
renderDetalleInscripcion(getData.item);
} else {
// si no, al menos refrescamos el listado
cargarInscripciones({ q: filtroActual.q, page: 1, pageSize: 20 });
}
} catch (e) {
console.error(e);
if (errEl) errEl.textContent = 'Error de conexión con el servidor.';
}
}

e.preventDefault();
renderDashboard();
});

renderDashboard();
actualizarMenuActivo('menu-dashboard');
});

function actualizarMenuActivo(menuId) {
// Remover clase activa de todos los items
document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
item.classList.remove('active');
});
// Agregar clase activa al item seleccionado
const menuItem = document.getElementById(menuId);
if (menuItem) menuItem.classList.add('active');
}

// =======================
// VISTA: MARATONES (CSV históricos)
// =======================
function renderMaratones() {
const main = document.getElementById('main-content');
main.innerHTML = `
<h2>Maratones (histórico)</h2>
<div style="margin-top:12px; padding:12px; border:1px solid #eee; border-radius:12px; background:#fff;">
<p style="margin:0 0 10px 0; opacity:.8">
Importá un CSV con columnas:
<code>edicion,nombre,dni,email,carrera,fecha_inscripcion</code>
</p>
<input id="csvFile" type="file" accept=".csv" />
<button id="btnImportarCsv" type="button"
style="margin-left:8px; padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer">
Importar CSV
</button>
<div id="importResult" style="margin-top:12px;"></div>
</div>
<div style="margin-top:16px; padding:12px; border:1px solid #eee; border-radius:12px; background:#fff;">
<div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
<h3 style="margin:0">Listado histórico</h3>
<select id="filtroEdicion" style="padding:8px; border-radius:8px; border:1px solid #ddd;">
<option value="">Todas las ediciones</option>
</select>
<input id="buscarHistorico" type="search" placeholder="Buscar por nombre/DNI/email/carrera"
style="padding:8px; border-radius:8px; border:1px solid #ddd; min-width:260px" />
<span id="histTotal" style="opacity:.7"></span>
</div>
<div id="histTabla" style="margin-top:12px;">Cargando...</div>
</div>
`;
document.getElementById('btnImportarCsv').addEventListener('click', importarHistoricoCSV);
// cargar listado inicial
cargarHistorico();
// eventos filtros
document.getElementById('buscarHistorico').addEventListener('change', () => cargarHistorico({ page: 1 }));
document.getElementById('filtroEdicion').addEventListener('change', () => cargarHistorico({ page: 1 }));
}

async function importarHistoricoCSV() {
const fileInput = document.getElementById('csvFile');
const resultBox = document.getElementById('importResult');
resultBox.innerHTML = '';
const file = fileInput.files?.[0];
if (!file) {
resultBox.innerHTML = `<p style="color:#b00020;margin:0">Seleccioná un archivo .csv</p>`;
return;
}
const fd = new FormData();
fd.append('csv', file);
resultBox.innerHTML = `<p style="margin:0;opacity:.8">Importando...</p>`;
try {
const res = await fetch('../api/historico_importar.php', {
method: 'POST',
body: fd,
credentials: 'include'
});
const data = await res.json().catch(() => ({}));
if (!res.ok || !data.success) {
resultBox.innerHTML = `<p style="color:#b00020;margin:0">Error: ${esc(data.message || 'No se pudo importar')}</p>`;
return;
}
const inserted = data.inserted ?? 0;
const errors = Array.isArray(data.errors) ? data.errors : [];
resultBox.innerHTML = `
<p style="margin:0;color:#0a7a2f"><strong>OK</strong> Importados: ${inserted}</p>
${errors.length ? `
<details style="margin-top:8px">
<summary style="cursor:pointer;color:#b00020">Ver errores (${errors.length})</summary>
<ul style="margin:8px 0 0 18px">
${errors.map(e => `<li>${esc(e)}</li>`).join('')}
</ul>
</details>
` : `<p style="margin:6px 0 0 0;opacity:.8">Sin errores.</p>`}
`;
await cargarHistorico({ page: 1 });
} catch (e) {
console.error(e);
resultBox.innerHTML = `<p style="color:#b00020;margin:0">Error de conexión con el servidor</p>`;
}
}

let historicoFiltro = { edicion: '', q: '', page: 1, pageSize: 50 };
async function cargarHistorico({ page } = {}) {
const tabla = document.getElementById('histTabla');
const totalEl = document.getElementById('histTotal');
const selEd = document.getElementById('filtroEdicion');
const inputQ = document.getElementById('buscarHistorico');
if (!tabla || !totalEl || !selEd || !inputQ) return;
if (page) historicoFiltro.page = page;
historicoFiltro.q = inputQ.value.trim();
historicoFiltro.edicion = selEd.value;
const offset = (historicoFiltro.page - 1) * historicoFiltro.pageSize;
tabla.innerHTML = 'Cargando...';
try {
const url = `../api/historico_listar.php?limit=${historicoFiltro.pageSize}&offset=${offset}&q=${encodeURIComponent(historicoFiltro.q)}&edicion=${encodeURIComponent(historicoFiltro.edicion)}`;
const res = await fetch(url, { credentials: 'include' });
const data = await res.json().catch(() => ({}));
if (!res.ok || !data.success) throw new Error(data.message || 'No se pudo cargar histórico');
// cargar opciones de ediciones una vez
if (selEd.options.length <= 1 && Array.isArray(data.ediciones)) {
data.ediciones.forEach(ed => {
const opt = document.createElement('option');
opt.value = String(ed);
opt.textContent = String(ed);
selEd.appendChild(opt);
});
}
totalEl.textContent = `Total: ${data.total ?? 0}`;
const items = Array.isArray(data.items) ? data.items : [];
const rows = items.map(r => `
<tr>
<td>${esc(r.edicion)}</td>
<td>${esc(r.nombre)}</td>
<td>${esc(r.dni)}</td>
<td>${esc(r.email)}</td>
<td>${esc(r.carrera)}</td>
<td>${formatearFecha(r.fecha_inscripcion)}</td>
</tr>
`).join('');
tabla.innerHTML = `
<table style="width:100%; border-collapse:collapse">
<thead>
<tr>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">Edición</th>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">Nombre</th>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">DNI</th>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">Email</th>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">Carrera</th>
<th style="text-align:left; padding:10px; border:1px solid #eee; background:#2f323a; color:#fff;">Fecha inscripción</th>
</tr>
</thead>
<tbody>
${rows || `<tr><td colspan="6" style="padding:16px; text-align:center; border:1px solid #eee;">Sin datos</td></tr>`}
</tbody>
</table>
`;
} catch (e) {
tabla.innerHTML = `<p style="color:#b00020;margin:0">Error: ${esc(e.message)}</p>`;
}
}

// Click del menú "Maratones"
document.getElementById('menu-maratones')?.addEventListener('click', (e) => {
e.preventDefault();
renderMaratones();
actualizarMenuActivo('menu-maratones');
});
</script>
